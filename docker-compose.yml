services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: brainydec, POSTGRES_USER: brainydec, POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me} }
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    command: redis-server --requirepass ${REDIS_PASSWORD:-change-me-too}
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://brainydec:${DB_PASSWORD:-change-me}@db:5432/brainydec
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me-too}@redis:6379/0
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application -b 0.0.0.0:8000 -w 3"
    volumes: [media:/app/media]
    depends_on: [db, redis]
    restart: unless-stopped
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://brainydec:${DB_PASSWORD:-change-me}@db:5432/brainydec
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me-too}@redis:6379/0
    command: celery -A config worker -l info
    depends_on: [db, redis]
  frontend:
    build: ./frontend
    expose: ["80"]
    volumes: [media:/media:ro]
    depends_on: [backend]
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data]
    depends_on: [frontend]
    restart: unless-stopped
volumes: { pgdata: {}, media: {}, caddy_data: {} }
