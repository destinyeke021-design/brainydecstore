server_tokens off;
server {
  listen 80;
  client_max_body_size 8m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://res.cloudinary.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
  }
  # Admin panel: keep behind VPN/IP allow-list. Edit the allow line to your IP, or remove this block entirely.
  location /django-admin/ {
    # allow 203.0.113.10;
    # deny all;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }
  # Private uploads are NEVER served directly (bank-transfer proofs, delivery evidence).
  location ~ ^/media/(proofs|delivery_evidence)/ { return 404; }
  location /media/ { alias /media/; autoindex off; }
  location / { root /usr/share/nginx/html; try_files $uri /index.html; }
}
